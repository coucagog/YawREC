# =============================================================
# YAWREC · workflow CI
# À chaque push / pull request : tests Rust + build frontend (Windows)
# et compilation de l'app Android.
# =============================================================
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  desktop:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: yawrec
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: yawrec/src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: yawrec/package-lock.json

      - name: Install FFmpeg dev libs
        shell: pwsh
        run: |
          $url = "https://github.com/GyanD/codexffmpeg/releases/download/7.1/ffmpeg-7.1-full_build-shared.7z"
          $archive = "$env:RUNNER_TEMP\ffmpeg.7z"
          Invoke-WebRequest -Uri $url -OutFile $archive
          7z x $archive -o"$env:RUNNER_TEMP\ffmpeg" -y
          $ff_dir = (Get-ChildItem "$env:RUNNER_TEMP\ffmpeg" -Directory)[0].FullName
          "FFMPEG_DIR=$ff_dir" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$ff_dir\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Frontend build
        run: |
          npm ci
          npm run build

      - name: Rust tests
        working-directory: yawrec/src-tauri
        run: cargo test --locked

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle -p YawREC_mobile/android assembleDebug testDebugUnitTest
