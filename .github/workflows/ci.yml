# =============================================================
# YAWREC · workflow CI
# À chaque push / pull request : tests Rust, build frontend et exécutable
# portable téléchargeable (Windows) ; APK Android de test téléchargeable.
# =============================================================
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  desktop:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: yawrec
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: yawrec/src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: yawrec/package-lock.json

      - name: Install FFmpeg dev libs
        shell: pwsh
        run: |
          $url = "https://github.com/GyanD/codexffmpeg/releases/download/7.1/ffmpeg-7.1-full_build-shared.7z"
          $archive = "$env:RUNNER_TEMP\ffmpeg.7z"
          Invoke-WebRequest -Uri $url -OutFile $archive
          7z x $archive -o"$env:RUNNER_TEMP\ffmpeg" -y
          $ff_dir = (Get-ChildItem "$env:RUNNER_TEMP\ffmpeg" -Directory)[0].FullName
          "FFMPEG_DIR=$ff_dir" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$ff_dir\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Frontend build
        run: |
          npm ci
          npm run build

      - name: Rust tests
        working-directory: yawrec/src-tauri
        run: cargo test --locked

      # ----------------------------------------------------------
      # Exécutable de test (portable, non signé) téléchargeable depuis
      # la page du run. L'installeur reste produit par release.yml.
      # ----------------------------------------------------------
      - name: Generate icons
        # icon.ico n'est pas versionné ; la CLI Tauri accepte le SVG source.
        run: npx tauri icon docs/icon-source.svg

      - name: Build release executable
        # bash et non pwsh : PowerShell avale le `--` en appelant npx.ps1,
        # et `--locked` arrive alors à la CLI Tauri au lieu de cargo.
        # En cas d'échec, la fin du log est publiée en annotation (lisible
        # sans être connecté, contrairement aux logs du job).
        shell: bash
        run: |
          set -o pipefail
          if ! npx tauri build --no-bundle -- --locked 2>&1 | tee "$RUNNER_TEMP/build.log"; then
            msg=$(tail -n 60 "$RUNNER_TEMP/build.log" | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=tauri build::$msg"
            exit 1
          fi

      - name: Collect portable build
        shell: pwsh
        run: |
          $out = "portable"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Get-ChildItem src-tauri\target\release -Filter *.exe -File |
            ForEach-Object { Copy-Item $_.FullName $out\ }
          Copy-Item src-tauri\resources\ffmpeg-dlls\*.dll $out\
          Get-ChildItem $out | Format-Table Name, Length

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: yawrec-windows-portable-${{ github.sha }}
          path: yawrec/portable/
          retention-days: 14

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle -p YawREC_mobile/android assembleDebug testDebugUnitTest

      # APK de test (signé avec la clé debug) téléchargeable depuis la page
      # du run : s'installe en autorisant les sources inconnues.
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: yawrec-android-debug-${{ github.sha }}
          path: YawREC_mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
